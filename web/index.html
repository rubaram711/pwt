<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pwt_website">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pwt_website</title>
  <link rel="manifest" href="manifest.json">

  <!-- Stripe.js — required for the embedded card element used at checkout -->
  <script src="https://js.stripe.com/v3/"></script>

  <!--
    Splash screen shown while flutter_bootstrap.js (the compiled app) and its
    engine finish loading — without it the browser shows a blank white page
    for that whole time. Pure HTML/CSS so it paints immediately, before any
    JS has run; removed once Flutter dispatches 'flutter-first-frame'.
  -->
  <style>
    #splash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.25s ease-out;
    }
    #splash.pwt-splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      width: 150px;
      height: auto;
      margin-bottom: 28px;
    }
    #splash .pwt-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #E5E7EB;
      border-top-color: #1D4ED8;
      border-radius: 50%;
      animation: pwt-spin 0.8s linear infinite;
    }
    @keyframes pwt-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="assets/assets/images/full_logo_2.png" alt="PWT">
    <div class="pwt-spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('pwt-splash-hidden');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
